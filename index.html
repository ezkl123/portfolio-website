        <li><a href="#contact">Contact</a></li>

    <div class="hero-text">
      <h1>Hi, I’m Alex.<br> I build things for the web.</h1>
      <button>View My Work</button>
    </div>
    <div class="hero-image">
      <img src="placeholder.jpg" alt="Hero Image" />

  </section>

  <!-- Projects Section -->
  <section id="projects">
    <h2>Projects</h2>
    <div class="project-grid">
      <div class="project-item">

      </div>
      <div class="project-item">
        <img src="placeholder.jpg" alt="Project 4" />

        <p>description</p>
      </div>
    </div>
  </section>

  <!-- Tools Section -->
  <section id="tools">
    <h2>Tools</h2>
    <div class="tools-icons">
      <img src="tool1.png" alt="Tool 1" />
      <img src="tool2.png" alt="Tool 2" />
      <img src="tool3.png" alt="Tool 3" />
      <img src="tool4.png" alt="Tool 4" />
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <h2>About Me</h2>
    <div class="about-content">
      <img src="profile.jpg" alt="Profile Picture" />
      <div class="bio">
        <p>Short bio</p>
        <p>More info here...</p>
      </div>
    </div>

  <!-- Contact Section -->
