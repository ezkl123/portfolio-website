<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Muhammad Hammad Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="body">

  <header class="header">
    <div class="logo">Logo</div>
    <nav class="navbar">
      <a class="nav-styling" href="#projects">Projects</a>
      <a class="nav-styling" href="#tools">Tools</a>
      <a class="nav-styling" href="#about">About</a>
      <a class="nav-styling" href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="intro-background">
    <div class="intro">
      <div id="intro-text">
        <h1 class="font">Muhammad Hammad<br> Building scalable solutions, <br> one line at a time.</h1>
      </div>
      <div class="intro-image">
        <img src="placeholder.jpg" alt="Hero Image" />
      </div>
    </div>
    <button id="project-button">View My Work</button>
    <br>
  </section>

  <!-- Projects Section -->
  <section>
    <h2 class="sub-headings font">Projects</h2>
    <div class="projects-and-tools">
        <div class="items">
          <img src="placeholder.jpg" alt="Project 1" />
          <h3>Project Title</h3>
          <p>description</p>
        </div>
        <div class="items">
          <img src="placeholder.jpg" alt="Project 2" />
          <h3>Project Title</h3>
          <p>description</p>
        </div>
        <div class="items">
          <img src="placeholder.jpg" alt="Project 3" />
          <h3>Project Title</h3>
          <p>description</p>
        </div>
        <div class="items">
          <img src="placeholder.jpg" alt="Project 4" />
          <h3>Project Title</h3>
          <p>description</p>
        </div>
    </div>
  </section>

  <!-- Tools Section -->
  <section id="tools">
    <h2 class="sub-headings">Tools</h2>
    <div class="projects-and-tools">
      <img class="items" src="tool1.png" alt="Tool 1" />
      <img class="items" src="tool2.png" alt="Tool 2" />
      <img class="items" src="tool3.png" alt="Tool 3" />
      <img class="items" src="tool4.png" alt="Tool 4" />
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <h2 class="sub-headings">About Me</h2>
    <div class="about-content">
      <img src="profile.jpg" alt="Profile Picture" />
      <div id="bio">
        <p>Short bio</p>
      </div>
    </div>
  </section>

  <!-- Contact Section -->
  <section>
    <h2 class="sub-headings">Contact</h2>
    <div id="contact-info">
      <p>Lorem Ipsum Dolor Sit Amet</p>
    </div>
  </section>

</body>
</html>
